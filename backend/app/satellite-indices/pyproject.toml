[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-indices"
version = "0.1.0"
description = "Sentinel-2 vegetation/water/built-up index calculation with validated area-of-interest handling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "shapely>=2.0", "pyproj>=3.6", "pyshp>=2.3", "pydantic>=2.0"]

[project.optional-dependencies]
ee = ["earthengine-api>=0.1.390"]
dev = ["pytest>=8", "ruff>=0.5", "pydantic-ai-slim>=1.0"]
demo = ["matplotlib>=3.8"]
agent = ["pydantic-ai-slim>=1.0"]
agent-anthropic = ["pydantic-ai-slim[anthropic]>=1.0"]
agent-openai = ["pydantic-ai-slim[openai]>=1.0"]
agent-google = ["pydantic-ai-slim[google]>=1.0"]

[tool.setuptools.packages.find]
include = ["satellite_indices*"]

[tool.setuptools.package-data]
satellite_indices = ["data/*.geojson", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
